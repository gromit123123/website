<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos — Digital Space</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo"><a href="index.html">My Space.</a></div>
        <nav class="site-nav">
            <a href="about.html">About</a>
            <a href="gear.html">Gear</a>
            <a href="photos.html">Photos</a>
        </nav>
    </header>

    <main class="container photo-container fade-in">
        <section class="hero-section">
            <h1>Visual Journal</h1>
            <p class="hero-subtitle">手机摄影记录的城市肌理与旅行足迹。</p>
        </section>

        <div class="photo-grid">
            <figure class="photo-item">
                <img src="https://images.unsplash.com/photo-1507699622108-4be3abd695ad?auto=format&fit=crop&w=800&q=80" alt="Auckland Skyline" loading="lazy">
                <figcaption>
                    <strong>Auckland, New Zealand</strong><br>
                    它是新西兰北岛最大的城市。这里拥有丰富的火山地貌和优美的海岸线。多元文化的交融赋予了这座城市独特的活力。
                </figcaption>
            </figure>
            <figure class="photo-item">
                <img src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=800&q=80" alt="London Architecture" loading="lazy">
                <figcaption>
                    <strong>London, United Kingdom</strong><br>
                    它是英国的首都与政治文化中心。这座城市将古老的历史建筑与现代商业完美融合。泰晤士河贯穿市区，见证了其数个世纪的繁华。
                </figcaption>
            </figure>
            <figure class="photo-item">
                <img src="https://images.unsplash.com/photo-1549480665-27f12e3e5714?auto=format&fit=crop&w=800&q=80" alt="York Shambles" loading="lazy">
                <figcaption>
                    <strong>York, United Kingdom</strong><br>
                    它是英格兰北部的历史名城。这里保存着完整的中世纪城墙和著名的约克大教堂。游客通常选择在火车站寄存大件行李以方便徒步游览。
                </figcaption>
            </figure>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
